<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSVT-R KPI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.kpi{
    text-align:center;
}

.kpi h2{
    color:#2563eb;
    margin-top:10px;
}

.chart{
    height:350px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

</style>
</head>
<body>

<h1>PSVT-R KPI Dashboard</h1>

<div class="grid">

<div class="card kpi">
<h3>Total Students</h3>
<h2 id="totalStudents">0</h2>
</div>

<div class="card kpi">
<h3>Average Score</h3>
<h2 id="avgScore">0</h2>
</div>

<div class="card kpi">
<h3>Average Accuracy</h3>
<h2 id="avgAccuracy">0%</h2>
</div>

<div class="card kpi">
<h3>Average Confidence</h3>
<h2 id="avgConfidence">0</h2>
</div>

</div>

<br>

<div class="grid">

<div class="card">
<div id="overallChart"></div>
</div>

<div class="card">
<div id="maleChart"></div>
</div>

<div class="card">
<div id="femaleChart"></div>
</div>

<div class="grid">

   <div class="card">
    <div id="cluster1LineChart"></div>
</div>

</div> </div>

<br>

<div class="card">
<div id="scatterChart"></div>
</div>

<br>

<div class="card">
<button onclick="exportCSV()">Export CSV</button>
</div>

<br>

<div class="card">

<h2>Student Ranking</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Email</th>
<th>Gender</th>
<th>Score</th>
<th>Accuracy</th>
<th>Confidence</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

</div>

<script src="admin.js"></script>

</body>
</html>
