<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSVT-R KPI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;
}

h1{
    text-align: center;
    margin-bottom: 20px;
}

.grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card{
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.kpi{
    text-align: center;
}

.kpi h2{
    color: #2563eb;
    margin-top: 10px;
}

button{
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
}

table{
    width: 100%;
    border-collapse: collapse;
}

th, td{
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th{
    background: #2563eb;
    color: white;
}
</style>
</head>
<body>

<h1>PSVT-R KPI Dashboard</h1>

<div class="grid">
    <div class="card kpi">
        <h3>Total Students</h3>
        <h2 id="totalStudents">0</h2>
    </div>

    <div class="card kpi">
        <h3>Average Score</h3>
        <h2 id="avgScore">0</h2>
    </div>

    <div class="card kpi">
        <h3>Average Accuracy</h3>
        <h2 id="avgAccuracy">0%</h2>
    </div>

    <div class="card kpi">
        <h3>Average Confidence</h3>
        <h2 id="avgConfidence">0</h2>
    </div>
</div>

<br>

<div class="grid">
    <div class="card">
        <div id="overallChart"></div>
    </div>

    <div class="card">
        <div id="maleChart"></div>
    </div>

    <div class="card">
        <div id="femaleChart"></div>
    </div>

    <div class="card">
        <div id="cluster1LineChart"></div>
    </div> 
</div>

<br>

<div class="card">
    <div id="scatterChart"></div>
</div>

<br>

<div class="card">
    <button onclick="exportCSV()">Export CSV</button>
</div>

<br>

<div class="card">
    <h2>Student Ranking</h2>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Email</th>
                <th>Gender</th>
                <th>Score</th>
                <th>Accuracy</th>
                <th>Confidence</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>
</div>

<script>
const BASE = "https://online-test-system-pqd0.onrender.com";
let allStudents = [];

async function loadDashboard(){
    try {
        const response = await fetch(BASE + "/results");
        const students = await response.json();
        allStudents = Array.isArray(students) ? students : [];

        /* KPI Calculation Elements */
        document.getElementById("totalStudents").innerText = allStudents.length;

        let totalScore = 0;
        let totalAccuracy = 0;
        let totalConfidence = 0;

        allStudents.forEach(s => {
            totalScore += s.score || 0;
            totalAccuracy += parseFloat(s.accuracy || 0);
            totalConfidence += s.confidenceScore || 0;
        });

        if(allStudents.length){
            document.getElementById("avgScore").innerText = (totalScore / allStudents.length).toFixed(2);
            document.getElementById("avgAccuracy").innerText = (totalAccuracy / allStudents.length).toFixed(2) + "%";
            document.getElementById("avgConfidence").innerText = (totalConfidence / allStudents.length).toFixed(2);
        }

        /* OVERALL CLUSTER METRICS WITH NULL-SAFETY RUNTIME FILTERS */
        let c1=0, c2=0, c3=0;
        allStudents.forEach(student => {
            if (!student || !Array.isArray(student.answers)) return;
            
            student.answers.forEach((ans, index) => {
                if (!ans) return; // Prevent "Cannot read properties of null (reading 'isCorrect')"
                const q = index + 1;
                if(ans.isCorrect){
                    if([1,2,6,10].includes(q)) c1++;
                    if([3,4,5].includes(q)) c2++;
                    if([7,8,9].includes(q)) c3++;
                }
            });
        });

        const totalStudentsCount = allStudents.length || 1;
        const c1Acc = ((c1 / (totalStudentsCount * 4)) * 100 || 0).toFixed(2);
        const c2Acc = ((c2 / (totalStudentsCount * 3)) * 100 || 0).toFixed(2);
        const c3Acc = ((c3 / (totalStudentsCount * 3)) * 100 || 0).toFixed(2);
        const overall = ((parseFloat(c1Acc) + parseFloat(c2Acc) + parseFloat(c3Acc)) / 3).toFixed(2);

        new ApexCharts(document.querySelector("#overallChart"), {
            chart: { type: 'bar', height: 350 },
            series: [{
                name: 'Accuracy',
                data: [Number(c1Acc), Number(c2Acc), Number(c3Acc), Number(overall)]
            }],
            xaxis: { categories: ['C1', 'C2', 'C3', 'Overall'] },
            title: { text: 'Overall Performance' },
            dataLabels: { enabled: true }
        }).render();

        /* Male Performance Demographics */
        const males = allStudents.filter(s => s && s.gender === "Male");
        drawGenderChart(males, "#maleChart", "Male Performance");

        /* Female Performance Demographics */
        const females = allStudents.filter(s => s && s.gender === "Female");
        drawGenderChart(females, "#femaleChart", "Female Performance");

        /* Cluster-Wise Dynamic Line Distribution */
        generateClusterGenderCharts(allStudents);

        /* Table Mapping */
        const sorted = [...allStudents].sort((a, b) => (b.score || 0) - (a.score || 0));
        document.getElementById("studentTable").innerHTML = sorted.map((s, i) => `
            <tr>
                <td>#${i + 1}</td>
                <td>${s.name || ''}</td>
                <td>${s.email || ''}</td>
                <td>${s.gender || ''}</td>
                <td>${s.score || 0}</td>
                <td>${s.accuracy || 0}%</td>
                <td>${s.confidenceScore || 0}</td>
            </tr>
        `).join("");

        /* Isolated Scatter Plot Fetch Layer */
        try {
            const scatterResponse = await fetch(BASE + "/scatter-data");
            const scatter = await scatterResponse.json();
            
            if (Array.isArray(scatter)) {
                new ApexCharts(document.querySelector("#scatterChart"), {
                    chart: { type: 'scatter', height: 350 },
                    series: [{
                        name: "Students",
                        data: scatter.map(s => ({
                            x: s.thinkingTime || 0,
                            y: s.score || 0
                        }))
                    }],
                    title: { text: 'Thinking Time vs Score' },
                    xaxis: { title: { text: 'Thinking Time' } },
                    yaxis: { title: { text: 'Score' } }
                }).render();
            }
        } catch (scatterError) {
            console.error("Scatter plot chart endpoint calculation error bypass:", scatterError);
        }

    } catch (globalError) {
        console.error("Critical Runtime System Exception Engine Alert: ", globalError);
    }
}

function drawGenderChart(students, selector, title){
    let c1=0, c2=0, c3=0;
    students.forEach(student => {
        if (!student || !Array.isArray(student.answers)) return;
        
        student.answers.forEach((ans, index) => {
            if (!ans) return; // Prevent nested property check errors
            const q = index + 1;
            if(ans.isCorrect){
                if([1,2,6,10].includes(q)) c1++;
                if([3,4,5].includes(q)) c2++;
                if([7,8,9].includes(q)) c3++;
            }
        });
    });

    const total = students.length || 1;
    const a = ((c1 / (total * 4)) * 100).toFixed(2);
    const b = ((c2 / (total * 3)) * 100).toFixed(2);
    const c = ((c3 / (total * 3)) * 100).toFixed(2);
    const overall = ((parseFloat(a) + parseFloat(b) + parseFloat(c)) / 3).toFixed(2);

    new ApexCharts(document.querySelector(selector), {
        chart: { type: 'bar', height: 350 },
        series: [{
            name: 'Accuracy',
            data: [Number(a), Number(b), Number(c), Number(overall)]
        }],
        xaxis: { categories: ['C1', 'C2', 'C3', 'Overall'] },
        title: { text: title },
        dataLabels: { enabled: true }
    }).render();
}

function generateClusterGenderCharts(students){
    const males = students.filter(s => s && s.gender === "Male");
    const females = students.filter(s => s && s.gender === "Female");

    function clusterAccuracy(group, questions){
        let correct = 0;
        let evaluableStudentsCount = 0;

        group.forEach(student => {
            if (!student || !Array.isArray(student.answers)) return;
            evaluableStudentsCount++;
            
            student.answers.forEach((ans, index) => {
                if (!ans) return;
                const qNo = index + 1;
                if(questions.includes(qNo) && ans.isCorrect){
                    correct++;
                }
            });
        });

        const total = evaluableStudentsCount * questions.length;
        return total ? Number(((correct / total) * 100).toFixed(2)) : 0;
    }

    const maleData = [
        clusterAccuracy(males, [1,2,6,10]),
        clusterAccuracy(males, [3,4,5]),
        clusterAccuracy(males, [7,8,9])
    ];

    const femaleData = [
        clusterAccuracy(females, [1,2,6,10]),
        clusterAccuracy(females, [3,4,5]),
        clusterAccuracy(females, [7,8,9])
    ];

    new ApexCharts(document.querySelector("#cluster1LineChart"), {
        chart: { type: 'line', height: 350 },
        series: [
            { name: 'Male', data: maleData },
            { name: 'Female', data: femaleData }
        ],
        xaxis: { categories: ['Cluster 1', 'Cluster 2', 'Cluster 3'] },
        title: { text: 'Cluster-wise Male vs Female Comparison' },
        stroke: { width: 4 },
        markers: { size: 6 }
    }).render();
}

function exportCSV(){
    let csv = "Name,Email,Gender,Score,Accuracy,Confidence\n";
    allStudents.forEach(s => {
        if (!s) return;
        csv += `"${s.name || ''}","${s.email || ''}","${s.gender || ''}",${s.score || 0},${s.accuracy || 0},${s.confidenceScore || 0}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "student_results.csv";
    a.click();
}

loadDashboard();
</script>
</body>
</html>
