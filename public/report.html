<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            color: black;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2563eb;
        }

        .info p {
            font-size: 20px;
            margin: 15px 0;
        }

        /* =====================================
           SCORE DISPLAY BADGES
           ===================================== */
        .score-container {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        .score-card {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .score-card .label {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .score-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #0f172a;
            margin-top: 5px;
        }

        .score-card.passed { border-left: 5px solid #16a34a; }
        .score-card.passed .value { color: #16a34a; }
        .score-card.failed { border-left: 5px solid #dc2626; }
        .score-card.failed .value { color: #dc2626; }

        /* =====================================
           MALPRACTICE BANNER
           ===================================== */
        .malpractice-banner {
            background: #fef2f2;
            border: 2px solid #ef4444;
            border-left: 8px solid #ef4444;
            border-radius: 12px;
            padding: 25px;
            color: #991b1b;
            margin: 25px 0;
            text-align: center;
        }

        .malpractice-banner h2 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .text-danger {
            color: #dc2626 !important;
            font-weight: bold;
        }

        /* =====================================
           TABLE STYLES
           ===================================== */
        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="loadingBox">
            <h1 style="text-align:center; color:#2563eb;">
                Assessment Submitted Successfully
            </h1>
            <p style="margin-top:30px; text-align:center; font-size:22px; line-height:1.8;">
                ✅ Your assessment has been submitted successfully.
                <br><br>
                📄 Please wait for your assessment report.
                <br><br>
                ⏳ It will take a few seconds to generate.
            </p>
        </div>

        <div id="reportData" style="display:none;"></div>

    </div>

    <script>
        setTimeout(() => {
            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("reportData").style.display = "block";

            const report = JSON.parse(localStorage.getItem("testReport"));

            if (!report) {
                document.getElementById("reportData").innerHTML = `
                    <h2 style="text-align:center; color:red;">
                        No Report Data Found
                    </h2>`;
                return;
            }

            // Detect Malpractice Status Flag
            const isMalpractice = report.malpracticeDetected === true || report.behaviorAnalysis === "Disqualified (Malpractice)";

            let html = "";

            if (isMalpractice) {
                // 1. RENDER MALPRACTICE REPORT DISPLAY
                html += `
                    <h1 style="text-align:center; color:#dc2626;">
                        Assessment Submitted Successfully
                    </h1>

                    <div class="malpractice-banner">
                        <h2>🚨 ASSESSMENT DISQUALIFIED (MALPRACTICE) 🚨</h2>
                        <p>
                            This test session was terminated immediately because you navigated away from the testing interface. 
                            Under standard examination security protocols, your performance result has been set to zero.
                        </p>
                    </div>

                    <div class="score-container">
                        <div class="score-card failed">
                            <div class="label">Final Score</div>
                            <div class="value">0 / ${report.totalQuestions || 10}</div>
                        </div>
                        <div class="score-card failed">
                            <div class="label">Accuracy Rate</div>
                            <div class="value">0.00%</div>
                        </div>
                    </div>

                    <div class="info">
                        <h2 style="margin-top:20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px;">Participant Profile</h2>
                        <p><strong>Name:</strong> ${report.name}</p>
                        <p><strong>Email:</strong> ${report.email}</p>
                        <p><strong>Gender:</strong> ${report.gender}</p>
                        <p><strong>Age:</strong> ${report.age}</p>
                        <p><strong>Profession:</strong> ${report.profession}</p>
                    </div>
                `;
            } else {
                // 2. RENDER HONEST REPORT DISPLAY (SCORE AT TOP)
                html += `
                    <h1 style="text-align:center; color:#2563eb;">
                        Assessment Submitted Successfully
                    </h1>

                    <div class="score-container">
                        <div class="score-card passed">
                            <div class="label">Final Score</div>
                            <div class="value">${report.score} / ${report.totalQuestions}</div>
                        </div>
                        <div class="score-card passed">
                            <div class="label">Accuracy Rate</div>
                            <div class="value">${report.accuracy}%</div>
                        </div>
                    </div>

                    <div class="info">
                        <h2 style="margin-top:20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px;">Participant Profile</h2>
                        <p><strong>Name:</strong> ${report.name}</p>
                        <p><strong>Email:</strong> ${report.email}</p>
                        <p><strong>Gender:</strong> ${report.gender}</p>
                        <p><strong>Age:</strong> ${report.age}</p>
                        <p><strong>Profession:</strong> ${report.profession}</p>
                    </div>

                    <h2 style="margin-top:40px;">Question Wise Analysis</h2>
                    <table>
                        <tr>
                            <th>Question</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                            <th>Status</th>
                            <th>Time Taken</th>
                        </tr>
                `;

                report.answers.forEach(answer => {
                    const selected = answer.selectedOption ? answer.selectedOption : "Not Answered";
                    const correct = answer.correctAnswer ? answer.correctAnswer : "N/A";
                    
                    html += `
                        <tr>
                            <td>${answer.question}</td>
                            <td>${selected}</td>
                            <td>${correct}</td>
                            <td>
                                ${answer.isCorrect ? "✅ Correct" : "❌ Wrong"}
                            </td>
                            <td>${answer.timeTakenInSeconds} sec</td>
                        </tr>
                    `;
                });

                html += `</table>`;
            }

            document.getElementById("reportData").innerHTML = html;

        }, 3000);
    </script>
</body>

</html>
