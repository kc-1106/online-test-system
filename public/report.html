<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Test Report</title>

<style>

body{

    font-family:Arial,sans-serif;

    background:#0f172a;

    color:white;

    padding:40px;
}

.container{

    max-width:1000px;

    margin:auto;

    background:white;

    color:black;

    padding:40px;

    border-radius:20px;
}

h1{

    text-align:center;

    margin-bottom:30px;

    color:#2563eb;
}

.info p{

    font-size:20px;

    margin:15px 0;
}

table{

    width:100%;

    margin-top:30px;

    border-collapse:collapse;
}

th,td{

    border:1px solid #ccc;

    padding:12px;

    text-align:center;
}

th{

    background:#2563eb;

    color:white;
}

</style>

</head>

<body>

<div class="container">

    <h1>Test Report</h1>

    <div id="loadingBox">

    <h1 style="
        text-align:center;
        color:#2563eb;
    ">
        Assessment Submitted Successfully
    </h1>

    <p style="
        margin-top:30px;
        text-align:center;
        font-size:22px;
        line-height:1.8;
    ">

        ✅ Your assessment has been submitted successfully.

        <br><br>

        📄 Please wait for your assessment report.

        <br><br>

        ⏳ It will take a few seconds to generate.

    </p>

</div>

<div id="reportData"
     style="display:none;">
</div>

</div>



<script>

setTimeout(() => {

    document.getElementById(
        "loadingBox"
    ).style.display = "none";

    document.getElementById(
        "reportData"
    ).style.display = "block";

    const report =
        JSON.parse(
            localStorage.getItem(
                "testReport"
            )
        );

    if(!report){

        document.getElementById(
            "reportData"
        ).innerHTML =

        `<h2 style="
            text-align:center;
            color:red;
        ">
            No Report Data Found
        </h2>`;

        return;
    }

    let html = `

    <h1 style="
        text-align:center;
        color:#2563eb;
    ">
        PSVT-R Assessment Report
    </h1>

    <div class="info">

        <p><strong>Name :</strong>
        ${report.name}</p>

        <p><strong>Email :</strong>
        ${report.email}</p>

        <p><strong>Gender :</strong>
        ${report.gender}</p>

        <p><strong>Age :</strong>
        ${report.age}</p>

        <p><strong>Profession :</strong>
        ${report.profession}</p>

        <p><strong>Score :</strong>
        ${report.score} / ${report.totalQuestions}</p>

        <p><strong>Correct Answers :</strong>
        ${report.correctAnswers}</p>

        <p><strong>Wrong Answers :</strong>
        ${report.wrongAnswers}</p>

       <p><strong>Accuracy :</strong>
       ${report.accuracy}</p>

        <p><strong>Confidence Score :</strong>
        ${report.confidenceScore}</p>

        <p><strong>Completion Rate :</strong>
        ${report.completionRate}%</p>

        <p><strong>Behavior :</strong>
        ${report.behaviorAnalysis}</p>

        <p><strong>Average Thinking Time :</strong>
        ${report.averageThinkingTime} sec</p>

    </div>

    <h2>Cluster Analysis</h2>

    <table>

        <tr>

            <th>Cluster</th>
            <th>Performance</th>

        </tr>

        <tr>

            <td>Easy Cluster</td>
            <td>${report.easyPerformance}%</td>

        </tr>

        <tr>

            <td>Moderate Cluster</td>
            <td>${report.moderatePerformance}%</td>

        </tr>

        <tr>

            <td>Hard Cluster</td>
            <td>${report.hardPerformance}%</td>

        </tr>

    </table>

    <h2 style="margin-top:30px;">
        Question Wise Analysis
    </h2>

    <table>

        <tr>

            <th>Question</th>
            <th>Your Answer</th>
            <th>Correct Answer</th>
            <th>Status</th>
            <th>Time Taken</th>

        </tr>

    `;

    report.answers.forEach(answer => {

        html += `

        <tr>

            <td>${answer.question}</td>

            <td>
                ${answer.selectedOption}
            </td>

            <td>
                ${answer.correctAnswer}
            </td>

            <td>
                ${answer.isCorrect
                    ? "✅ Correct"
                    : "❌ Wrong"}
            </td>

            <td>
                ${answer.timeTakenInSeconds} sec
            </td>

        </tr>

        `;

    });

    html += `</table>`;

    document.getElementById(
        "reportData"
    ).innerHTML = html;

},3000);

</script>
</body>
</html>
